name: CI/CD Process
on:
  workflow_call:
    inputs:
      release:
        required: false
        type: string
        default: "false"
  workflow_dispatch:
    inputs:
      release:
        description: "Trigger a release?"
        required: false
        default: "false"

env:
  UV_FROZEN: "1"

jobs:
  code-style:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Architecture tests
        run: uv run pytest tests/architecture -q

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Test (SQLite)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Integration tests (PostgreSQL)
        run: uv run pytest tests/integration -q

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ github.event.repository.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --rm --name api -p 8000:8000 -e DATABASE_URL=memory:// ${{ github.event.repository.name }}:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && break || sleep 1
          done
          curl -fs http://localhost:8000/health
          docker stop api

  dry-website-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Test website generation
        run: |
          cd docs
          npm ci
          npm run build

  release:
    if: >-
      github.ref == 'refs/heads/main'
      && inputs.release == 'true'
      && !contains(github.event.head_commit.message, '[skip ci]')
    # Permissions are inherited from the caller (dispatcher.yml). Declaring write
    # permissions here would make every Dependabot/fork PR run fail at startup, since
    # their token is read-only and a called job may not request more than it gets.
    outputs:
      has_released: ${{ env.HAS_RELEASED }}
      release_version: ${{ env.RELEASE_VERSION }}
    concurrency:
      group: release-${{ github.ref }}
    runs-on: ubuntu-24.04
    needs:
      - code-style
      - test
      - test-postgres
      - docker-build
      - dry-website-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  upload-docs:
    concurrency:
      group: upload-docs-${{ github.ref }}
    runs-on: ubuntu-24.04
    needs:
      - code-style
      - test
      - dry-website-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Generate doc website
        run: |
          cd docs
          npm ci
          npm run build
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-image:
    runs-on: ubuntu-24.04
    needs: release
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
      HAS_RELEASED: ${{ needs.release.outputs.has_released }}
    # Runs after `release` whether it released or was skipped, but never after a failed
    # release: `latest` must not be built from a commit the release job rejected.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.release.result != 'failure'
      && needs.release.result != 'cancelled'
    steps:
      - name: Checkout the released tag (or the pushed commit when nothing was released)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HAS_RELEASED == 'true' && format('v{0}', env.RELEASE_VERSION) || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags="${image}:latest"
          if [ "$HAS_RELEASED" = "true" ]; then tags="${tags},${image}:${RELEASE_VERSION}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  success:
    runs-on: ubuntu-24.04
    needs:
      - code-style
      - test
      - test-postgres
      - docker-build
      - dry-website-build
      - release
      - upload-docs
      - deploy-image
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
