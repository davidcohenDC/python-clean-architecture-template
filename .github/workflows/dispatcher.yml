name: CI/CD
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Trigger a release?'
        required: false
        default: 'false'

# Granted to every job of the called workflow (jobs inherit; none declares its own, see
# build-and-deploy.yml). On pull requests from Dependabot or forks GitHub caps the token to
# read-only, which is fine: the jobs that write only run on pushes to main.
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # Avoid running twice on PRs from the same repository (push + pull_request).
  dispatcher:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || startsWith(github.head_ref, 'dependabot/')
    steps:
      - run: 'true'

  ci-cd:
    needs:
      - dispatcher
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      release: ${{ github.event.inputs.release || 'true' }}
    secrets: inherit
