[project]
name = "python-clean-architecture-template"
version = "0.5.1"
description = "A pragmatic, test-enforced Clean Architecture template for Python APIs (FastAPI + SQLAlchemy)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "David Cohen" }]
keywords = ["clean-architecture", "hexagonal-architecture", "fastapi", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "sqlalchemy[asyncio]>=2.0.41",
    "aiosqlite>=0.21",
    "alembic>=1.16",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.urls]
Homepage = "https://github.com/davidcohenDC/python-clean-architecture-template"
Documentation = "https://davidcohendc.github.io/python-clean-architecture-template/"
Issues = "https://github.com/davidcohenDC/python-clean-architecture-template/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6.1",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanarch"]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff: linting + formatting (replaces black, isort, flake8, pyupgrade)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TCH",      # type-checking imports
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "ANN",      # annotations (public API must be typed)
]
ignore = [
    "ANN401",   # Any is sometimes the honest type at the edges
    "N818",     # domain errors are named after the rule (OrderAlreadyShipped), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]           # test signatures don't need full annotations
"alembic/**" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["cleanarch"]

# ──────────────────────────────────────────────────────────────────────────────
# mypy: strict on the whole package
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cleanarch"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ──────────────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # `import archcheck` in tests
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real database (SQLite by default, TEST_DATABASE_URL to override)",
    "contract: runs on a temporary copy of the project (slower)",
    "proof(*ids): evidence for the executable architecture guarantee(s) in proofs.toml",
]

[tool.coverage.run]
source = ["cleanarch"]
branch = true
omit = ["src/cleanarch/main.py", "src/cleanarch/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ['pragma: no cover', 'if TYPE_CHECKING:', '^\s*\.\.\.$']
